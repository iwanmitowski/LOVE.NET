name: lovenet

# Infrastructure tier: one Postgres per stateful service (bulkhead isolation),
# single-node Kafka in KRaft mode, Redis for the SignalR backplane + presence.
# Application services are added on top of this file (see README).

x-postgres-common: &postgres-common
  image: postgres:16-alpine
  environment: &postgres-env
    POSTGRES_USER: lovenet
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lovenet}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U lovenet"]
    interval: 5s
    timeout: 3s
    retries: 12
  networks:
    - net

services:
  identity-db:
    <<: *postgres-common
    container_name: lovenet-identity-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: lovenet_identity
    ports:
      - "5433:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data

  profile-db:
    <<: *postgres-common
    container_name: lovenet-profile-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: lovenet_profile
    ports:
      - "5434:5432"
    volumes:
      - profile-db-data:/var/lib/postgresql/data

  matching-db:
    <<: *postgres-common
    container_name: lovenet-matching-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: lovenet_matching
    ports:
      - "5435:5432"
    volumes:
      - matching-db-data:/var/lib/postgresql/data

  chat-db:
    <<: *postgres-common
    container_name: lovenet-chat-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: lovenet_chat
    ports:
      - "5436:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data

  notifications-db:
    <<: *postgres-common
    container_name: lovenet-notifications-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: lovenet_notifications
    ports:
      - "5437:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lovenet-kafka
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - net

  # One-shot topic creation. Auto-creation is disabled on the broker so every
  # topic gets its intended partition count (ordering is per partition).
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lovenet-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() { kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1; }
        create identity.user-registered 3
        create identity.user-banned 3
        create profile.user-updated 3
        create matching.match-created 3
        create chat.message-sent 8
        create chat.room-provisioned 3
        create notifications.email-requested 3
        create dead-letter 1
        create healthchecks-topic 1
        echo "Topics ready:"
        kafka-topics --bootstrap-server kafka:9092 --list
    networks:
      - net

  redis:
    image: redis:7-alpine
    container_name: lovenet-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: lovenet-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
    networks:
      - net

  # ---------------------------------------------------------------- services

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/LoveNet.Identity.Api/Dockerfile
    container_name: lovenet-identity-api
    environment: &service-env
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:9092
      Jwt__Key: ${JWT_KEY:-lovenet-local-development-signing-key-do-not-use-in-production-0123456789abcdef}
      Jwt__Issuer: ${JWT_ISSUER:-https://localhost:3000/}
      Jwt__Audience: ${JWT_AUDIENCE:-https://localhost:3000/}
      ConnectionStrings__Default: Host=identity-db;Port=5432;Database=lovenet_identity;Username=lovenet;Password=${POSTGRES_PASSWORD:-lovenet}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__Key: ${CLOUDINARY_KEY:-}
      Cloudinary__Secret: ${CLOUDINARY_SECRET:-}
    ports:
      - "8081:8080"
    depends_on:
      identity-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: &service-health
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - net

  profile-api:
    build:
      context: .
      dockerfile: src/Services/Profile/LoveNet.Profile.Api/Dockerfile
    container_name: lovenet-profile-api
    environment:
      <<: *service-env
      ConnectionStrings__Default: Host=profile-db;Port=5432;Database=lovenet_profile;Username=lovenet;Password=${POSTGRES_PASSWORD:-lovenet}
    ports:
      - "8082:8080"
    depends_on:
      profile-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *service-health
    networks:
      - net

  matching-api:
    build:
      context: .
      dockerfile: src/Services/Matching/LoveNet.Matching.Api/Dockerfile
    container_name: lovenet-matching-api
    environment:
      <<: *service-env
      ConnectionStrings__Default: Host=matching-db;Port=5432;Database=lovenet_matching;Username=lovenet;Password=${POSTGRES_PASSWORD:-lovenet}
    ports:
      - "8083:8080"
    depends_on:
      matching-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *service-health
    networks:
      - net

  chat-api:
    build:
      context: .
      dockerfile: src/Services/Chat/LoveNet.Chat.Api/Dockerfile
    container_name: lovenet-chat-api
    environment:
      <<: *service-env
      ConnectionStrings__Default: Host=chat-db;Port=5432;Database=lovenet_chat;Username=lovenet;Password=${POSTGRES_PASSWORD:-lovenet}
    ports:
      - "8084:8080"
    depends_on:
      chat-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *service-health
    networks:
      - net

  realtime-api:
    build:
      context: .
      dockerfile: src/Services/Realtime/LoveNet.Realtime.Api/Dockerfile
    container_name: lovenet-realtime-api
    environment:
      <<: *service-env
      Redis__Connection: redis:6379
    ports:
      - "8085:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *service-health
    networks:
      - net

  notifications-api:
    build:
      context: .
      dockerfile: src/Services/Notifications/LoveNet.Notifications.Api/Dockerfile
    container_name: lovenet-notifications-api
    environment:
      <<: *service-env
      ConnectionStrings__Default: Host=notifications-db;Port=5432;Database=lovenet_notifications;Username=lovenet;Password=${POSTGRES_PASSWORD:-lovenet}
      SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
    ports:
      - "8086:8080"
    depends_on:
      notifications-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *service-health
    networks:
      - net

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/LoveNet.Gateway/Dockerfile
    container_name: lovenet-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:-lovenet-local-development-signing-key-do-not-use-in-production-0123456789abcdef}
      Jwt__Issuer: ${JWT_ISSUER:-https://localhost:3000/}
      Jwt__Audience: ${JWT_AUDIENCE:-https://localhost:3000/}
      Frontend__Origin: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Services__Identity: http://identity-api:8080
      Services__Profile: http://profile-api:8080
      Services__Matching: http://matching-api:8080
      Services__Chat: http://chat-api:8080
      Services__Realtime: http://realtime-api:8080
      ReverseProxy__Clusters__identity__Destinations__destination1__Address: http://identity-api:8080
      ReverseProxy__Clusters__profile__Destinations__destination1__Address: http://profile-api:8080
      ReverseProxy__Clusters__matching__Destinations__destination1__Address: http://matching-api:8080
      ReverseProxy__Clusters__chat__Destinations__destination1__Address: http://chat-api:8080
      ReverseProxy__Clusters__realtime__Destinations__destination1__Address: http://realtime-api:8080
    ports:
      - "8080:8080"
    depends_on:
      identity-api:
        condition: service_healthy
      profile-api:
        condition: service_healthy
      matching-api:
        condition: service_healthy
      chat-api:
        condition: service_healthy
      realtime-api:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
    healthcheck: *service-health
    networks:
      - net

  frontend:
    build:
      context: ./Web-FrontEnd
      dockerfile: Dockerfile
    container_name: lovenet-frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - gateway
    networks:
      - net

volumes:
  identity-db-data:
  profile-db-data:
  matching-db-data:
  chat-db-data:
  notifications-db-data:
  kafka-data:

networks:
  net:
